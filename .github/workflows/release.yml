name: GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check bin/wwsrapport.js
      - name: Build archive
        run: zip -r "wwsrapport-cli-${GITHUB_REF_NAME}.zip" bin package.json README.md LICENSE CHANGELOG.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "wwsrapport-cli-${GITHUB_REF_NAME}.zip" --generate-notes --verify-tag

